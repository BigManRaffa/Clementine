# Tiny Tapeout project information
project:
  title:        "Clementine: 4-lane int8 SIMT GPU"      # Project title
  author:       "Rafeed Khan"      # Your name
  discord:      "rafeed"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "SPI Programmable 4-lane int8 SIMT GPU with Hardware Divergence"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     40000000      # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "2x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_bigmanraffa_clm"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_bigmanraffa_clm.v"
    - "clm_spi_host.v"
    - "clm_fetch_seq.v"
    - "clm_decoder.v"
    - "clm_mask_stack.v"
    - "clm_lane.v"
    - "clm_regfile.v"
    - "clm_alu.v"
    - "clm_mult_bw.v"
    - "clm_fa.v"
    - "clm_ha.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "CMD0 (SPI command bit 0)"
  ui[1]: "CMD1 (SPI command bit 1)"
  ui[2]: "CMD2 (SPI command bit 2)"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

    # Outputs
  uo[0]: "DONE (sequencer halted)"
  uo[1]: "any lane active"
  uo[2]: "instruction commit"
  uo[3]: "replay state"
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "SPI CS_N"
  uio[1]: "SPI MOSI"
  uio[2]: "SPI MISO"
  uio[3]: "SPI SCLK"
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""
  
# Do not change!
yaml_version: 6
