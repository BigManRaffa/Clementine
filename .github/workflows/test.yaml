name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      # RTL sim needs the SKY130 cell models referenced in test/Makefile
      # ($(PDK_ROOT)/sky130A/libs.ref/sky130_fd_sc_hd/verilog/*.v).
      PDK_ROOT: ${{ github.workspace }}/pdk
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Install SKY130 PDK
        shell: bash
        run: |
          pip install volare
          # Enable the latest sky130 build into $PDK_ROOT (creates $PDK_ROOT/sky130A).
          volare enable --pdk sky130 "$(volare ls-remote --pdk sky130 | head -n1)"

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make will return success even if the test fails, so check for failure in the results.xml
          ! grep failure results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
